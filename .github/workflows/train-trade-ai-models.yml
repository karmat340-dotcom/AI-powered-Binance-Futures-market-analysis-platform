name: Train TRADE AI models

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/train-trade-ai-models.yml'
      - 'ml_backend/train.py'

permissions:
  contents: write

concurrency:
  group: trade-ai-model-training
  cancel-in-progress: false

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        working-directory: ml_backend
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Train scalp and normal models
        working-directory: ml_backend
        run: python train.py

      - name: Save trained models to repository
        run: |
          test -s ml_backend/models/model_scalp.joblib
          test -s ml_backend/models/model_normal.joblib
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ml_backend/models/model_scalp.joblib ml_backend/models/model_normal.joblib
          if git diff --cached --quiet; then
            echo "No model changes to commit."
          else
            git commit -m "Add trained TRADE AI models"
            git push origin HEAD:main
          fi
